{% extends "base.html" %}

{% block title %}Add Student - Simple{% endblock %}

{% block content %}
<h2>Add New Student (Simple Version)</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label>Name:</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Math Marks:</label>
                <input type="number" name="math_marks" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Science Marks:</label>
                <input type="number" name="science_marks" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>English Marks:</label>
                <input type="number" name="english_marks" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Attendance:</label>
                <input type="number" name="attendance" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Hours Studied:</label>
                <input type="number" name="hours_studied" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Assignments:</label>
                <input type="number" name="assignments" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Previous GPA:</label>
                <input type="number" step="0.01" name="prev_gpa" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Student</button>
            <a href="{{ url_for('admin_students_list') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
