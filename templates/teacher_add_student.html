{% extends "base.html" %}

{% block title %}Add New Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">➕ Add New Student & Run Prediction</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Student Name *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Attendance (%) *</label>
                            <input type="number" step="any" name="attendance" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Math Marks *</label>
                            <input type="number" step="any" name="math_marks" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Science Marks *</label>
                            <input type="number" step="any" name="science_marks" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">English Marks *</label>
                            <input type="number" step="any" name="english_marks" class="form-control" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Hours Studied/day *</label>
                            <input type="number" step="any" name="hours_studied" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Assignments (%) *</label>
                            <input type="number" step="any" name="assignments" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Previous GPA *</label>
                            <input type="number" step="any" name="prev_gpa" class="form-control" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('dashboard_teacher') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save & Predict 🔮</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
